<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smith Michael Admin</title>
<link rel="icon" type="image/jpeg" href="/sm-smith-mark.jpg">
<style>
:root {
  --bg: #0D0D0D;
  --ink: #F5F2EA;
  --muted: #A6A39B;
  --line: #292929;
  --card: #141414;
  --accent: #C8A96B;
  --side: #0A0A0A;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 Inter, Arial, sans-serif; }
.app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
.side { background: var(--side); color: #fff; padding: 24px 14px; display: flex; flex-direction: column; gap: 6px; border-right: 1px solid var(--line); }
.side strong { font-size: 13px; letter-spacing: .12em; padding: 0 10px 22px; display: flex; align-items: center; gap: 8px; }
.side button { background: transparent; color: var(--muted); border: 0; text-align: left; padding: 11px 12px; border-radius: 0; font: inherit; cursor: pointer; }
.side button.on, .side button:hover { background: #171717; color: var(--ink); }
.view-site { color: var(--accent); text-decoration: none; padding: 12px 12px; margin-top: auto; font-size: 13px; }
.side #logout { margin-top: 0; }
.main { padding: 32px 36px 64px; max-width: 1180px; width: 100%; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 22px; }
.top h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -.03em; }
.top p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); }
th, td { text-align: left; padding: 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
td { font-size: 14px; word-break: break-word; }
td a { color: var(--accent); text-decoration: none; }
.btn { border: 0; background: var(--ink); color: #111; padding: 10px 14px; cursor: pointer; font: 700 12px Inter, Arial; letter-spacing: .04em; white-space: nowrap; }
.btn.add { background: var(--accent); color: #0D0D0D; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.danger { background: transparent; color: #d7a09a; border: 1px solid #5a3330; }
.row-actions { display: flex; gap: 8px; flex-wrap: nowrap; }
.hidden { display: none !important; }
.modal { position: fixed; inset: 0; display: none; place-items: center; padding: 20px; z-index: 40; }
.modal.open { display: grid; }
.backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.62); }
.modal-card { position: relative; width: min(560px, 100%); max-height: 92vh; overflow: auto; background: var(--card); padding: 26px; z-index: 1; border: 1px solid var(--line); }
.modal h2 { margin: 0 0 8px; font-size: 20px; }
label { display: grid; gap: 7px; margin: 14px 0; font-weight: 700; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
input, textarea { font: inherit; padding: 11px; border: 1px solid var(--line); width: 100%; background: #0D0D0D; color: var(--ink); text-transform: none; letter-spacing: 0; font-weight: 400; }
.modal-actions { display: flex; gap: 8px; margin-top: 18px; }
.empty { padding: 28px; color: var(--muted); border: 1px dashed var(--line); background: var(--card); }
.admin-thumb { width: 64px; height: 48px; object-fit: cover; display: inline-block; background: #222; }
.toast { position: fixed; right: 20px; bottom: 20px; background: #171717; color: #fff; padding: 13px 17px; display: none; border: 1px solid var(--line); z-index: 50; }
.toast.show { display: block; }

.work-grid { display: grid; gap: 16px; }
.work-card { display: grid; grid-template-columns: 168px 1fr; gap: 18px; background: var(--card); border: 1px solid var(--line); padding: 16px; }
.work-shot { width: 168px; height: 112px; object-fit: cover; background: #111; border: 1px solid var(--line); display: block; }
.work-shot.blank { display: grid; place-items: center; color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.work-body h3 { margin: 0 0 6px; font-size: 16px; font-weight: 600; }
.work-url { color: var(--accent); font-size: 12px; text-decoration: none; display: inline-block; margin-bottom: 8px; word-break: break-all; }
.work-url.off { color: var(--muted); }
.work-desc { margin: 0 0 12px; color: var(--muted); font-size: 13px; line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.work-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.tag { border: 1px solid var(--line); color: var(--ink); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; padding: 4px 8px; }
.work-actions { display: flex; gap: 8px; }

.preview-thumb { width: 120px; height: 80px; object-fit: cover; border: 1px solid var(--line); margin-top: 6px; display: none; }
.preview-thumb.on { display: block; }

@media (max-width: 760px) {
  .app { display: block; }
  .side { flex-direction: row; flex-wrap: wrap; align-items: center; }
  .side strong { width: 100%; padding-bottom: 10px; }
  .side #logout { margin-left: auto; }
  .main { padding: 20px; overflow: hidden; }
  .work-card { grid-template-columns: 1fr; }
  .work-shot, .work-shot.blank { width: 100%; height: 160px; }
  table, thead, tbody, tr, td { display: block; width: 100%; }
  thead { display: none; }
  tr { background: var(--card); border: 1px solid var(--line); margin-bottom: 12px; padding: 8px; }
  td { border: 0; padding: 7px 8px; }
  td:before { display: block; color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 4px; }
  #enquiryRows td:nth-child(1):before { content: 'Date'; }
  #enquiryRows td:nth-child(2):before { content: 'Name'; }
  #enquiryRows td:nth-child(3):before { content: 'Email'; }
  #enquiryRows td:nth-child(4):before { content: 'Project'; }
  #enquiryRows td:nth-child(5):before { content: 'Budget'; }
  #enquiryRows td:nth-child(6):before { content: 'Message'; }
  #testimonialRows td:nth-child(1):before { content: 'Image'; }
  #testimonialRows td:nth-child(2):before { content: 'Client'; }
  #testimonialRows td:nth-child(3):before { content: 'Role'; }
  #testimonialRows td:nth-child(4):before { content: 'Actions'; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <strong><img src="/sm-smith-mark.jpg" alt="" style="width:38px;height:30px;object-fit:contain">SMITH MICHAEL</strong>
    <button class="tab on" data-tab="portfolio">Portfolio</button>
    <button class="tab" data-tab="testimonials">Testimonials</button>
    <button class="tab" data-tab="enquiries">Enquiries</button>
    <a class="view-site" href="/smith" target="_blank">View website ↗</a>
    <button id="logout">Log out</button>
  </aside>
  <main class="main">
    <section id="portfolio">
      <div class="top">
        <div>
          <h1>Portfolio</h1>
          <p>Only work you add here shows on the public site.</p>
        </div>
        <button class="btn add" id="addPortfolio">Add work</button>
      </div>
      <div class="work-grid" id="portfolioRows"></div>
    </section>
    <section id="testimonials" class="hidden">
      <div class="top"><h1>Testimonials</h1><button class="btn add" id="addTestimonial">Add testimonial</button></div>
      <div class="table-wrap"><table><thead><tr><th>Image</th><th>Client</th><th>Role</th><th>Actions</th></tr></thead><tbody id="testimonialRows"></tbody></table></div>
    </section>
    <section id="enquiries" class="hidden">
      <div class="top"><h1>Enquiries</h1></div>
      <div class="table-wrap"><table><thead><tr><th>Date</th><th>Name</th><th>Email</th><th>Project</th><th>Budget</th><th>Message</th></tr></thead><tbody id="enquiryRows"></tbody></table></div>
    </section>
  </main>
</div>

<div class="modal" id="portfolioModal">
  <div class="backdrop"></div>
  <form class="modal-card" id="portfolioForm">
    <h2 id="portfolioModalTitle">Add work</h2>
    <input type="hidden" id="portfolioId">
    <label>Name<input id="portfolioName" required placeholder="Mirah Tracy | Author website"></label>
    <label>Description<textarea id="portfolioDescription" rows="6" required></textarea></label>
    <label>Website URL<input id="portfolioUrl" type="url" placeholder="https://"></label>
    <label>Thumbnail image
      <input id="portfolioImage" type="file" accept="image/*">
      <img class="preview-thumb" id="portfolioPreview" alt="">
    </label>
    <label>Quote instead of image<textarea id="portfolioQuote" rows="2" placeholder="Optional"></textarea></label>
    <label>Tags<input id="portfolioTags" placeholder="Author Website, Contact Form"></label>
    <div class="modal-actions">
      <button class="btn add" type="submit">Save</button>
      <button class="btn ghost cancel" type="button">Cancel</button>
    </div>
  </form>
</div>

<div class="modal" id="testimonialModal">
  <div class="backdrop"></div>
  <form class="modal-card" id="testimonialForm">
    <h2 id="testimonialModalTitle">Add testimonial</h2>
    <input type="hidden" id="testimonialId">
    <label>Screenshot<input id="testimonialImage" type="file" accept="image/*"></label>
    <label>Name (admin only)<input id="testimonialClient"></label>
    <label>Note (admin only, not shown on site)<textarea id="testimonialQuote" rows="2"></textarea></label>
    <input type="hidden" id="testimonialRole">
    <div class="modal-actions">
      <button class="btn add" type="submit">Save</button>
      <button class="btn ghost cancel" type="button">Cancel</button>
    </div>
  </form>
</div>
<div id="toast" class="toast"></div>
<script src="/sm-admin.js?v=25"></script>
</body>
</html>
